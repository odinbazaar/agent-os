<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Agent OS — Dinamik ajan orkestrasyonu, SEO takibi ve iş akışı otomasyonu için modüler yapay zekâ işletim sistemi" />
  <title>Agent OS — Yapay Zekâ İşletim Sistemi</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    /* Critical inline CSS for instant dark background */
    body { background: #06070d; margin: 0; }
    #app { display: flex; height: 100vh; }
    .boot-screen {
      width: 100%; height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      font-family: 'Inter', sans-serif;
      color: #eef0f6;
    }
    .boot-logo {
      width: 64px; height: 64px;
      background: linear-gradient(135deg, #00e5ff, #7c4dff);
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem; margin-bottom: 24px;
      animation: pulse-boot 2s ease-in-out infinite;
    }
    @keyframes pulse-boot {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.8; }
    }
    .boot-text { font-size: 1.2rem; font-weight: 600; letter-spacing: -0.02em; }
    .boot-sub { font-size: 0.8rem; color: #5a5e72; margin-top: 8px; }
  </style>
</head>
<body>
  <div id="app">
    <div class="boot-screen">
      <div class="boot-logo">🤖</div>
      <div class="boot-text">Agent OS</div>
      <div class="boot-sub">Sistem başlatılıyor...</div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
